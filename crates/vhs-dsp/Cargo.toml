[package]
name = "apple-upscaler-vhs-dsp"
version = "2.0.0"
edition = "2021"
authors = ["Dhruv Gupta"]
description = "High-performance Rust DSP engine for NTSC VHS tape emulation, chroma carrier demodulation, and helical tracking jitter"

[lib]
name = "vhs_dsp"
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10"
byteorder = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
